<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Papan Skor (Display 2) — Kuis Cerdas Cermat Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
<style>
  :root {
    /* Palet Utama Madrasah: Hijau Tua, Hijau Lembut, Putih & Aksen Emas */
    --emerald-950: #022c22;
    --emerald-900: #064e3b;
    --emerald-800: #065f46;
    --emerald-700: #047857;
    --emerald-600: #059669;
    --emerald-500: #10b981;
    --emerald-100: #d1fae5;
    --emerald-50: #ecfdf5;

    --gold-700: #b45309;
    --gold-600: #d97706;
    --gold-500: #f59e0b;
    --gold-400: #fbbf24;
    --gold-300: #fcd34d;
    --gold-100: #fef3c7;
    --gold-50: #fffbeb;

    /* Light Mode (Default) */
    --bg-body: #f0fdf4;
    --bg-pattern: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.09) 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.08) 0%, transparent 45%);
    --bg-surface: #ffffff;
    --bg-surface-alt: #f8fafc;
    --bg-elevated: #ecfdf5;
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;
    --border-color: #cbd5e1;
    --border-soft: #e2e8f0;
    --shadow-sm: 0 2px 8px rgba(6, 78, 59, 0.06);
    --shadow-md: 0 8px 24px rgba(6, 78, 59, 0.10);
    --shadow-lg: 0 16px 40px rgba(6, 78, 59, 0.14);
    --header-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 55%, #047857 100%);
    --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    --arabic-bg: #fffbeb;
    --arabic-border: #fcd34d;
    --arabic-text: #022c22;
  }

  [data-theme="dark"] {
    --bg-body: #021812;
    --bg-pattern: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
                  radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.10) 0%, transparent 50%);
    --bg-surface: #062e22;
    --bg-surface-alt: #042219;
    --bg-elevated: #083b2c;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --border-color: #115e46;
    --border-soft: #0d4735;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.60);
    --header-gradient: linear-gradient(135deg, #01150f 0%, #064e3b 65%, #065f46 100%);
    --arabic-bg: rgba(251, 191, 36, 0.08);
    --arabic-border: rgba(251, 191, 36, 0.35);
    --arabic-text: #fef3c7;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-body);
    background-image: var(--bg-pattern);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* Tipografi Teks Arab Al-Qur'an & Hadis (RTL) */
  .arabic-text,
  [dir="rtl"] {
    font-family: 'Scheherazade New', 'Amiri', 'Traditional Arabic', serif;
    direction: rtl;
    text-align: right;
    line-height: 2.15;
    letter-spacing: 0;
    word-spacing: 3px;
  }

  .arabic-box {
    background: var(--arabic-bg);
    border: 2px solid var(--arabic-border);
    border-right: 6px solid var(--gold-500);
    border-radius: 16px;
    padding: 20px 28px;
    color: var(--arabic-text);
    font-size: 2.2rem;
    font-weight: 700;
    margin: 14px 0;
    box-shadow: var(--shadow-sm);
  }

  /* Header Utama Premium */
  .top-banner {
    background: var(--header-gradient);
    color: #ffffff;
    padding: 16px 28px;
    border-bottom: 4px solid var(--gold-400);
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-logo {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.65rem;
    color: var(--emerald-950);
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    flex-shrink: 0;
    overflow: hidden;
  }

  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .brand-titles h1 {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #ffffff;
    line-height: 1.25;
  }

  .brand-titles p {
    font-size: 0.85rem;
    color: var(--gold-300);
    font-weight: 600;
    margin-top: 2px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Tombol Standar & Premium */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.18s ease;
    text-decoration: none;
    user-select: none;
    white-space: nowrap;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--emerald-600), var(--emerald-800));
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.28);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--emerald-500), var(--emerald-700));
  }

  .btn-gold {
    background: var(--gold-gradient);
    color: #fff;
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.32);
  }
  .btn-gold:hover {
    filter: brightness(1.07);
  }

  .btn-outline {
    background: var(--bg-surface);
    color: var(--text-primary);
    border-color: var(--border-color);
  }
  .btn-outline:hover {
    border-color: var(--emerald-500);
    background: var(--bg-elevated);
  }

  .btn-glass {
    background: rgba(255, 255, 255, 0.14);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .btn-glass:hover {
    background: rgba(255, 255, 255, 0.24);
  }

  .btn-danger {
    background: #dc2626;
    color: #ffffff;
  }
  .btn-danger:hover {
    background: #b91c1c;
  }

  .btn-success {
    background: #16a34a;
    color: #ffffff;
  }
  .btn-success:hover {
    background: #15803d;
  }

  .btn-lg {
    padding: 13px 22px;
    font-size: 1rem;
    border-radius: 12px;
  }

  .btn-sm {
    padding: 6px 11px;
    font-size: 0.78rem;
    border-radius: 8px;
  }

  /* Kartu & Panel */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }

  .card-title {
    font-size: 1.08rem;
    font-weight: 800;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Badge & Indikator Status */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-emerald {
    background: var(--emerald-100);
    color: var(--emerald-900);
  }
  .badge-gold {
    background: var(--gold-100);
    color: var(--gold-700);
  }
  .badge-danger {
    background: #fee2e2;
    color: #991b1b;
  }
  .badge-info {
    background: #e0f2fe;
    color: #075985;
  }

  /* Form Input */
  .form-group {
    margin-bottom: 14px;
  }

  .form-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .form-control {
    width: 100%;
    padding: 10px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--border-color);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.92rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--emerald-600);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
  }

  textarea.form-control {
    min-height: 84px;
    resize: vertical;
  }

  /* Tabel Modern */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
  }

  table.modern-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  table.modern-table th {
    background: var(--emerald-900);
    color: #ffffff;
    font-weight: 700;
    text-align: left;
    padding: 12px 14px;
    white-space: nowrap;
  }

  table.modern-table td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: middle;
  }

  table.modern-table tr:hover td {
    background: var(--bg-elevated);
  }

  /* Animasi Perubahan Skor &Pergantian Soal */
  @keyframes scorePulse {
    0% { transform: scale(1); }
    35% { transform: scale(1.16); color: var(--gold-500); }
    100% { transform: scale(1); }
  }

  @keyframes slideFadeIn {
    0% { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes leaderCrownGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45), 0 12px 32px rgba(6, 78, 59, 0.18); }
    50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0), 0 16px 40px rgba(245, 158, 11, 0.30); }
  }

  .animate-slide-in {
    animation: slideFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .score-pop {
    animation: scorePulse 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Toast Notification */
  .toast-container {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 390px;
  }

  .toast-item {
    background: var(--emerald-950);
    color: #ffffff;
    border-left: 5px solid var(--gold-400);
    padding: 13px 18px;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    font-size: 0.9rem;
    font-weight: 600;
    animation: slideFadeIn 0.25s ease forwards;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .toast-item.toast-error {
    background: #7f1d1d;
    border-left-color: #f87171;
  }

  /* Modal Overlay */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 44, 34, 0.65);
    backdrop-filter: blur(4px);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  .modal-backdrop.active {
    display: flex;
  }

  .modal-box {
    background: var(--bg-surface);
    border-radius: 20px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 820px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px;
    animation: slideFadeIn 0.25s ease forwards;
  }

  /* Gaya Khusus Cetak PDF / Berita Acara */
  @media print {
    body {
      background: #ffffff !important;
      color: #000000 !important;
    }
    .no-print,
    .top-banner,
    .admin-sidebar,
    .toast-container {
      display: none !important;
    }
    .print-only {
      display: block !important;
    }
    .card {
      box-shadow: none !important;
      border: 1px solid #999 !important;
      break-inside: avoid;
    }
  }
</style>

  <style>
    .scoreboard-container {
      max-width: 1520px;
      margin: 0 auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: calc(100vh - 90px);
    }

    /* Baris Info Status Lomba & Babak Aktif */
    .scoreboard-status-bar {
      background: var(--bg-surface);
      border-radius: 18px;
      border: 2px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    /* Grid Kartu Skor Tim Besar */
    .teams-score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 22px;
      align-items: stretch;
    }

    .team-score-card {
      background: var(--bg-surface);
      border-radius: 24px;
      border: 2.5px solid var(--border-color);
      border-top: 10px solid var(--emerald-600);
      padding: 26px 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .team-score-card.is-leader {
      border-color: var(--gold-500);
      border-top-width: 10px;
      animation: leaderCrownGlow 2.4s infinite;
    }

    .team-score-card.score-gained {
      box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.45), var(--shadow-lg);
      transform: translateY(-4px);
    }

    .team-score-card.score-lost {
      box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.45), var(--shadow-lg);
    }

    .rank-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      background: var(--bg-elevated);
      color: var(--emerald-800);
      border: 1.5px solid var(--border-color);
    }

    .rank-ribbon.leader-ribbon {
      background: var(--gold-gradient);
      color: #ffffff;
      border-color: var(--gold-400);
    }

    .team-card-title {
      font-size: 1.48rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team-card-subtitle {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Angka Skor Sangat Besar & Jelas */
    .giant-score-box {
      my: 18px;
      padding: 20px 16px;
      margin: 18px 0;
      border-radius: 20px;
      background: var(--bg-surface-alt);
      border: 2px solid var(--border-soft);
      text-align: center;
      position: relative;
    }

    .giant-score-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4.6rem;
      font-weight: 800;
      line-height: 1;
      color: var(--emerald-700);
      letter-spacing: -1px;
    }

    [data-theme="dark"] .giant-score-number {
      color: var(--gold-400);
    }

    .delta-floating-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 5px 12px;
      border-radius: 99px;
      font-weight: 800;
      font-size: 1rem;
      animation: slideFadeIn 0.3s ease;
    }

    .delta-plus {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .delta-minus {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    /* Rincian Skor Per Babak & Statistik Benar/Salah */
    .babak-breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.84rem;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
    }

    .babak-breakdown-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* Panel Peringkat & Riwayat Penambahan/Pengurangan Nilai */
    .bottom-panels-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 22px;
    }

    .history-feed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-soft);
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    @media (max-width: 1024px) {
      .bottom-panels-grid {
        grid-template-columns: 1fr;
      }
      .giant-score-number {
        font-size: 3.6rem;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER PAPAN SKOR -->
  <header class="top-banner">
    <div class="brand-wrap">
      <div class="brand-logo" id="skorHeaderLogo">🏆</div>
      <div class="brand-titles">
        <h1 id="skorHeaderKegiatan">KUIS CERDAS CERMAT TIM AL-QUR'AN HADIS IX</h1>
        <p id="skorHeaderLembaga">PAPAN SKOR OTOMATIS REAL-TIME (DISPLAY 2)</p>
      </div>
    </div>

    <div class="top-actions">
      <button type="button" class="btn btn-glass btn-sm" onclick="KCC.openSeparateDisplay('soal')">🖥️ Buka Layar Soal</button>
      <button class="btn btn-glass btn-sm sound-toggle-btn" onclick="KCC.toggleSoundMute()">🔊 Suara Aktif</button>
      <button class="btn btn-glass btn-sm theme-toggle-btn" onclick="KCC.toggleTheme()">🌙 Dark Mode</button>
      <button class="btn btn-gold btn-sm" onclick="KCC.toggleFullscreen()">⛶ Layar Penuh</button>
    </div>
  </header>

  <main class="scoreboard-container">
    <!-- Baris Info Babak & Indikator Pemimpin -->
    <div class="scoreboard-status-bar">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <span class="badge badge-emerald" id="skorStatusPermainan" style="font-size:0.88rem;padding:6px 14px;">BERJALAN</span>
        <strong style="font-size:1.05rem;" id="skorBabakAktifText">Babak Aktif: Babak 1 - Wajib</strong>
      </div>
      <div id="skorLeaderHeadline" style="font-size:0.95rem;font-weight:800;color:var(--gold-600);">
        👑 Memimpin Saat Ini: -
      </div>

    <!-- Grid Kartu Skor Tim -->
    <section id="skorTeamsGrid" class="teams-score-grid"></section>

    <!-- Panel Bawah: Klasemen Peringkat & Riwayat Penambahan/Pengurangan Nilai -->
    <section class="bottom-panels-grid">
      <!-- Klasemen Peringkat Otomatis -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">🥇 Klasemen &amp; Peringkat Otomatis</div>
          <span class="badge badge-gold">Auto-Rank</span>
        </div>
        <div id="skorStandingsList"></div>
      </div>

      <!-- Riwayat Penambahan & Pengurangan Nilai -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">📜 Riwayat Penambahan &amp; Pengurangan Nilai</div>
          <span class="badge badge-emerald" id="skorSyncIndicator">Live Sync</span>
        </div>
        <div id="skorHistoryFeed" style="max-height:310px;overflow-y:auto;"></div>
      </div>
    </section>
  </main>
  </div>
<div id="toastContainer" class="toast-container no-print"></div>

<script>
    /**
     * ============================================================================
     * SHAREDUTILS — Versi GitHub Pages / Decoupled Frontend
     * ============================================================================
     */
    window.KCC = (function() {
      // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
      var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwRLpIxHvwGTsICnU_0J-2DNdMgV4-J7hci1Cvti3BbF-NPKMfWORmkIZzV0VSRIVZ4/exec'; 
      
      var TOKEN_STORAGE_KEY = 'KCC_ADMIN_SESSION_TOKEN';
      var ADMIN_NAME_KEY = 'KCC_ADMIN_OPERATOR_NAME';
      var THEME_KEY = 'KCC_UI_THEME_MODE';
      var SOUND_MUTED_KEY = 'KCC_SOUND_MUTED';

      var broadcastChannel = null;
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          broadcastChannel = new BroadcastChannel('kcc_madrasah_sync_channel');
        }
      } catch (e) {}

      function getAdminToken() {
        try { return sessionStorage.getItem(TOKEN_STORAGE_KEY) || ''; } 
        catch (e) { return ''; }
      }

      function setAdminToken(token, adminName) {
        try {
          if (token) {
            sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            if (adminName) sessionStorage.setItem(ADMIN_NAME_KEY, adminName);
          } else {
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
          }
        } catch (e) {}
      }

      function getAdminName() {
        try { return sessionStorage.getItem(ADMIN_NAME_KEY) || 'Administrator'; } 
        catch (e) { return 'Administrator'; }
      }

      /**
       * Fungsi komunikasi Fetch API ke Server Google Apps Script
       * Menggunakan text/plain untuk bypass CORS Preflight di GAS
       */
      function apiCall(action, payload) {
        var req = {
          action: action,
          token: getAdminToken(),
          payload: payload || {}
        };

        return fetch(GAS_API_URL, {
          method: 'POST',
          // Header text/plain sangat penting agar tidak diblokir oleh Google
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(req),
          redirect: 'follow'
        })
        .then(function(response) {
          if (!response.ok) throw new Error('Gagal menghubungi server.');
          return response.json();
        })
        .then(function(res) {
          if (res && res.publicSync && broadcastChannel) {
            try { broadcastChannel.postMessage({ type: 'SYNC_UPDATE', data: res.publicSync }); } catch (e) {}
          }
          return res;
        });
      }

      function onBroadcastSync(callback) {
        if (!broadcastChannel) return;
        broadcastChannel.addEventListener('message', function(ev) {
          if (ev && ev.data && ev.data.type === 'SYNC_UPDATE' && ev.data.data) {
            callback(ev.data.data);
          }
        });
      }

      /**
       * Membuka layar terpisah sekarang jauh lebih cepat dan simpel.
       * Cukup arahkan ke nama file HTML yang ada di GitHub Pages.
       */
      function openSeparateDisplay(targetMode) {
        var mode = String(targetMode || 'soal').toLowerCase().trim();
        var fileName = mode === 'skor' ? 'Skor.html' : 'Soal.html';
        
        var win = window.open(fileName, '_blank');
        if (!win) {
          showToast('Pop-up diblokir oleh browser. Silakan izinkan pop-up.', true);
        }
      }

      function showToast(message, isError) {
        var container = document.getElementById('toastContainer');
        if (!container) return;
        var el = document.createElement('div');
        el.className = 'toast-item' + (isError ? ' toast-error' : '');
        el.innerHTML = '<span>' + escapeHtml(message) + '</span>' +
          '<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#fff;cursor:pointer;font-weight:800;font-size:1rem;">✕</button>';
        container.appendChild(el);
        setTimeout(function() { if (el && el.parentElement) el.remove(); }, 4200);
      }

      function escapeHtml(str) {
        return String(str === null || str === undefined ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function initTheme() {
        var saved = 'light';
        try { saved = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeButtons(saved);
      }

      function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        updateThemeButtons(next);
      }

      function updateThemeButtons(theme) {
        var btns = document.querySelectorAll('.theme-toggle-btn');
        btns.forEach(function(btn) { btn.innerHTML = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode'; });
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(function() {}); } 
        else { if (document.exitFullscreen) document.exitFullscreen(); }
      }

      var audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume().catch(function() {}); }
        return audioCtx;
      }

      function isSoundMuted() {
        try { return localStorage.getItem(SOUND_MUTED_KEY) === '1'; } catch (e) { return false; }
      }

      function toggleSoundMute() {
        var next = !isSoundMuted();
        try { localStorage.setItem(SOUND_MUTED_KEY, next ? '1' : '0'); } catch (e) {}
        var btns = document.querySelectorAll('.sound-toggle-btn');
        btns.forEach(function(b) { b.innerHTML = next ? '🔇 Suara Mati' : '🔊 Suara Aktif'; });
        return next;
      }

      function playTone(freq, type, durationSec, startTimeOffset, gainVal) {
        if (isSoundMuted()) return;
        try {
          var ctx = getAudioCtx(); if (!ctx) return;
          var osc = ctx.createOscillator(); var gain = ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + (startTimeOffset || 0));
          gain.gain.setValueAtTime(gainVal || 0.18, ctx.currentTime + (startTimeOffset || 0));
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (startTimeOffset || 0) + durationSec);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(ctx.currentTime + (startTimeOffset || 0)); osc.stop(ctx.currentTime + (startTimeOffset || 0) + durationSec);
        } catch (e) {}
      }

      var sound = {
        correct: function() { playTone(523.25, 'triangle', 0.16, 0, 0.22); playTone(659.25, 'triangle', 0.16, 0.12, 0.22); playTone(783.99, 'triangle', 0.22, 0.24, 0.24); playTone(1046.50, 'triangle', 0.45, 0.36, 0.26); },
        wrong: function() { playTone(240, 'sawtooth', 0.25, 0, 0.18); playTone(185, 'sawtooth', 0.45, 0.22, 0.20); },
        tick: function() { playTone(880, 'sine', 0.06, 0, 0.09); },
        timeUp: function() { playTone(440, 'square', 0.22, 0, 0.20); playTone(330, 'square', 0.22, 0.22, 0.20); playTone(220, 'square', 0.65, 0.44, 0.24); },
        buzzer: function() { playTone(740, 'sawtooth', 0.14, 0, 0.24); playTone(987.77, 'sawtooth', 0.35, 0.14, 0.24); }
      };

      function parseCSV(text) {
        var clean = String(text || '').replace(/^\uFEFF/, '');
        var rows = []; var currentRow = []; var currentVal = ''; var inQuotes = false;
        for (var i = 0; i < clean.length; i++) {
          var ch = clean[i]; var next = clean[i + 1];
          if (inQuotes) {
            if (ch === '"' && next === '"') { currentVal += '"'; i++; } 
            else if (ch === '"') { inQuotes = false; } 
            else { currentVal += ch; }
          } else {
            if (ch === '"') { inQuotes = true; } 
            else if (ch === ',') { currentRow.push(currentVal); currentVal = ''; } 
            else if (ch === '\r' && next === '\n') { currentRow.push(currentVal); rows.push(currentRow); currentRow = []; currentVal = ''; i++; } 
            else if (ch === '\n' || ch === '\r') { currentRow.push(currentVal); rows.push(currentRow); currentRow = []; currentVal = ''; } 
            else { currentVal += ch; }
          }
        }
        if (currentVal !== '' || currentRow.length > 0) { currentRow.push(currentVal); rows.push(currentRow); }
        if (rows.length < 2) return [];
        var headers = rows[0].map(function(h) { return String(h || '').trim(); });
        var result = [];
        for (var r = 1; r < rows.length; r++) {
          if (rows[r].join('').trim() === '') continue;
          var obj = {};
          for (var c = 0; c < headers.length; c++) { obj[headers[c]] = rows[r][c] !== undefined ? rows[r][c] : ''; }
          result.push(obj);
        }
        return result;
      }

      function downloadFile(filename, content, mimeType) {
        var blob = new Blob([content], { type: mimeType || 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
      }

      document.addEventListener('DOMContentLoaded', initTheme);

      return {
        apiCall: apiCall, getAdminToken: getAdminToken, setAdminToken: setAdminToken, getAdminName: getAdminName,
        onBroadcastSync: onBroadcastSync, openSeparateDisplay: openSeparateDisplay, showToast: showToast,
        escapeHtml: escapeHtml, toggleTheme: toggleTheme, toggleFullscreen: toggleFullscreen,
        sound: sound, toggleSoundMute: toggleSoundMute, isSoundMuted: isSoundMuted,
        parseCSV: parseCSV, downloadFile: downloadFile
      };
    })();
  </script>

  <script>
    /**
     * ========================================================================
     * DISPLAYSKORAPP — Logika Papan Skor Otomatis (Display 2)
     * ========================================================================
     */
    window.DisplaySkorApp = (function() {
      var lastSyncVersion = null;
      var previousScores = {}; // idTim -> totalSkor
      var recentDeltaMap = {}; // idTim -> delta

      function init() {
        pollSync();
        setInterval(pollSync, 2000);

        
        KCC.onBroadcastSync(function(data) {
          if (data) {
            applyScoreboardSync(data);
          }
        });
      }

      function pollSync() {
        KCC.apiCall('GET_PUBLIC_SYNC', { clientVersion: lastSyncVersion })
          .then(function(res) {
            if (!res || !res.success || res.unchanged) return;
            applyScoreboardSync(res);
          })
          .catch(function() {});
      }

      function applyScoreboardSync(data) {
        lastSyncVersion = data.syncVersion;

        // Header
        document.getElementById('skorHeaderKegiatan').textContent = data.header.namaKegiatan;
        document.getElementById('skorHeaderLembaga').textContent = data.header.namaLembaga + ' • PAPAN SKOR RESMI';
        var logoEl = document.getElementById('skorHeaderLogo');
        if (data.header.logo) {
          logoEl.innerHTML = '<img src="' + KCC.escapeHtml(data.header.logo) + '" alt="Logo">';
        } else {
          logoEl.textContent = '🏆';
        }

        document.getElementById('skorStatusPermainan').textContent = data.header.statusPermainan;
        document.getElementById('skorBabakAktifText').textContent = 'Babak Aktif: ' + (data.gameState.currentBabak || '-');

        var sb = data.scoreboard || { teams: [], rankedTeams: [], maxScore: 0 };
        var teams = sb.teams || [];
        var ranked = sb.rankedTeams || [];

        // Indikator Pimpinan Lomba
        var leaders = teams.filter(function(t) { return t.isLeader; });
        var leaderEl = document.getElementById('skorLeaderHeadline');
        if (leaders.length === 1) {
          leaderEl.textContent = '👑 Memimpin Saat Ini: ' + leaders[0].namaTim + ' (' + leaders[0].totalSkor + ' Poin)';
        } else if (leaders.length > 1) {
          leaderEl.textContent = '⚡ Pimpinan Seri (' + leaders[0].totalSkor + ' Poin): ' + leaders.map(function(l) { return l.namaTim; }).join(' & ');
        } else {
          leaderEl.textContent = '👑 Seluruh Tim Siap Bertanding';
        }

        // Deteksi perubahan skor untuk animasi & efek visual
        var anyScoreIncreased = false;
        var anyScoreDecreased = false;
        recentDeltaMap = {};

        teams.forEach(function(t) {
          if (previousScores[t.idTim] !== undefined && previousScores[t.idTim] !== t.totalSkor) {
            var diff = t.totalSkor - previousScores[t.idTim];
            recentDeltaMap[t.idTim] = diff;
            if (diff > 0) anyScoreIncreased = true;
            if (diff < 0) anyScoreDecreased = true;
          }
          previousScores[t.idTim] = t.totalSkor;
        });

        if (anyScoreIncreased) {
          KCC.sound.correct();
        } else if (anyScoreDecreased) {
          KCC.sound.wrong();
        }

        // Render Kartu Skor Besar
        var grid = document.getElementById('skorTeamsGrid');
        var allBabaks = data.gameState.daftarBabak || [];

        grid.innerHTML = teams.map(function(t) {
          var delta = recentDeltaMap[t.idTim] || 0;
          var cardExtraClass = '';
          if (t.isLeader) cardExtraClass += ' is-leader';
          if (delta > 0) cardExtraClass += ' score-gained';
          if (delta < 0) cardExtraClass += ' score-lost';

          var deltaBadgeHtml = '';
          if (delta !== 0) {
            var sign = delta > 0 ? ('+' + delta) : String(delta);
            deltaBadgeHtml = '<span class="delta-floating-badge ' + (delta > 0 ? 'delta-plus' : 'delta-minus') + '">' + sign + '</span>';
          }

          var babakRowsHtml = allBabaks.map(function(b) {
            var val = (t.skorPerBabak && t.skorPerBabak[b]) || 0;
            return '<div class="babak-breakdown-row">' +
              '<span>' + KCC.escapeHtml(b) + '</span>' +
              '<strong>' + val + '</strong>' +
            '</div>';
          }).join('');

          return '<article class="team-score-card' + cardExtraClass + '" style="border-top-color:' + KCC.escapeHtml(t.warnaTim) + ';">' +
            '<div>' +
              '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
                '<span class="rank-ribbon ' + (t.isLeader ? 'leader-ribbon' : '') + '">' +
                  (t.isLeader ? '👑 MEMIMPIN • ' : '') + 'PERINGKAT #' + KCC.escapeHtml(t.peringkat) +
                '</span>' +
                '<button class="btn btn-outline btn-sm" title="Edit Nama Tim" onclick="DisplaySkorApp.editTeamName(\'' + KCC.escapeHtml(t.idTim) + '\', \'' + KCC.escapeHtml(t.namaTim) + '\', \'' + KCC.escapeHtml(t.namaMadrasah) + '\')">✏️ Edit</button>' +
              '</div>' +
              '<div class="team-card-title">' +
                '<span>' + KCC.escapeHtml(t.namaTim) + '</span>' +
              '</div>' +
              '<div class="team-card-subtitle">' + KCC.escapeHtml(t.namaMadrasah) + '</div>' +
            '</div>' +

            '<div class="giant-score-box">' +
              deltaBadgeHtml +
              '<div class="giant-score-number ' + (delta !== 0 ? 'score-pop' : '') + '">' + t.totalSkor + '</div>' +
              '<div style="font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-top:6px;">TOTAL SKOR</div>' +
            '</div>' +

            '<div>' +
              '<div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.82rem;font-weight:700;">' +
                '<span style="color:#16a34a;">✅ Benar: ' + t.jumlahBenar + '</span>' +
                '<span style="color:#dc2626;">❌ Salah: ' + t.jumlahSalah + '</span>' +
              '</div>' +
              '<div class="babak-breakdown-list">' + babakRowsHtml + '</div>' +
            '</div>' +
          '</article>';
        }).join('');

        // Render Klasemen Peringkat Otomatis
        var standingsWrap = document.getElementById('skorStandingsList');
        standingsWrap.innerHTML = ranked.map(function(t) {
          return '<div class="history-feed-item" style="border-left:5px solid ' + KCC.escapeHtml(t.warnaTim) + ';">' +
            '<div style="display:flex;align-items:center;gap:12px;">' +
              '<span class="badge ' + (t.isLeader ? 'badge-gold' : 'badge-emerald') + '" style="font-size:0.88rem;">#' + KCC.escapeHtml(t.peringkat) + '</span>' +
              '<div>' +
                '<div style="font-weight:800;font-size:0.98rem;">' + KCC.escapeHtml(t.namaTim) + '</div>' +
                '<div style="font-size:0.76rem;color:var(--text-muted);">' + KCC.escapeHtml(t.namaMadrasah) + '</div>' +
              '</div>' +
            '</div>' +
            '<div style="font-family:\'JetBrains Mono\',monospace;font-size:1.35rem;font-weight:800;color:var(--emerald-700);">' +
              t.totalSkor + ' <span style="font-size:0.75rem;font-weight:600;">poin</span>' +
            '</div>' +
          '</div>';
        }).join('');

        // Render Riwayat Penambahan & Pengurangan Nilai
        var histWrap = document.getElementById('skorHistoryFeed');
        var histList = data.recentHistory || [];
        if (histList.length === 0) {
          histWrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Belum ada riwayat perubahan skor.</div>';
        } else {
          histWrap.innerHTML = histList.map(function(h) {
  var sign = h.nilai >= 0 ? ('+' + h.nilai) : String(h.nilai);
  var badgeCls = h.nilai > 0 ? 'badge-emerald' : (h.nilai < 0 ? 'badge-danger' : 'badge-info');
  
  // PERBAIKAN BUG WAKTU 1899:
  var cleanWaktu = String(h.waktu || '');
  // Jika string waktu mengandung "1899" atau berupa objek panjang, kita ekstrak jamnya saja (contoh: 13:40:53)
  var timeMatch = cleanWaktu.match(/(\d{2}:\d{2}:\d{2})/);
  if (timeMatch) cleanWaktu = timeMatch[1];
  
  return '<div class="history-feed-item" style="' + (h.undone ? 'opacity:0.5;text-decoration:line-through;' : '') + '">' +
    '<div>' +
      '<div style="font-weight:800;">' + KCC.escapeHtml(h.namaTim) + ' <span style="font-weight:500;font-size:0.78rem;color:var(--text-muted);">• ' + KCC.escapeHtml(h.babak) + ' (' + cleanWaktu + ')</span></div>' +
      '<div style="font-size:0.8rem;color:var(--text-secondary);">' + KCC.escapeHtml(h.keterangan) + '</div>' +
    '</div>' +
    '<span class="badge ' + badgeCls + '" style="font-size:0.95rem;">' + sign + '</span>' +
  '</div>';
}).join('');
        }
      }

      /**
       * Fitur Edit Nama Tim langsung dari Papan Skor (Tersimpan ke Google Spreadsheet).
       */
      function editTeamName(idTim, currentName, currentMadrasah) {
        Swal.fire({
          title: '✏️ Edit Identitas Tim',
          html:
            '<div style="text-align:left; font-size:0.85rem; font-weight:bold; color:#334155; margin-bottom:5px;">Nama Tim:</div>' +
            '<input id="swal-input1" class="swal2-input" style="margin: 0 0 15px 0; width:100%;" value="' + currentName + '">' +
            '<div style="text-align:left; font-size:0.85rem; font-weight:bold; color:#334155; margin-bottom:5px;">Asal Kelas / Madrasah:</div>' +
            '<input id="swal-input2" class="swal2-input" style="margin: 0; width:100%;" value="' + currentMadrasah + '">',
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: 'Simpan',
          cancelButtonText: 'Batal',
          confirmButtonColor: '#059669',
          preConfirm: () => {
            return [ document.getElementById('swal-input1').value, document.getElementById('swal-input2').value ];
          }
        }).then((result) => {
          if (result.isConfirmed) {
            var newName = result.value[0];
            var newMadrasah = result.value[1];
            if (!newName || !newName.trim()) return;

            if (!KCC.getAdminToken()) {
              Swal.fire({
                title: '🔐 Otorisasi Operator',
                text: 'Masukkan Password Administrator untuk menyimpan perubahan nama tim:',
                input: 'password',
                inputAttributes: { autocapitalize: 'off', autocorrect: 'off' },
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Verifikasi',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#059669'
              }).then((pwdResult) => {
                if (pwdResult.isConfirmed && pwdResult.value) {
                  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                  KCC.apiCall('LOGIN_ADMIN', { password: pwdResult.value, adminName: 'Operator Papan Skor' })
                    .then(function(res) {
                      if (!res || !res.success) { Swal.fire('Akses Ditolak', (res && res.message) || 'Password salah.', 'error'); return; }
                      KCC.setAdminToken(res.token, res.adminName);
                      sendTeamUpdate(idTim, newName.trim(), newMadrasah.trim());
                      Swal.close();
                    });
                }
              });
            } else {
              sendTeamUpdate(idTim, newName.trim(), newMadrasah.trim());
            }
          }
        });
      }

      function sendTeamUpdate(idTim, namaTim, namaMadrasah) {
        KCC.apiCall('UPDATE_TEAM_NAME_INLINE', {
          idTim: idTim,
          namaTim: namaTim,
          namaMadrasah: namaMadrasah
        }).then(function(res) {
          if (!res || !res.success) {
            KCC.showToast((res && res.message) || 'Gagal mengubah nama tim.', true);
            return;
          }
          applyScoreboardSync(res.publicSync);
          KCC.showToast(res.message);
        });
      }

      document.addEventListener('DOMContentLoaded', init);

      return {
        editTeamName: editTeamName,
        refreshNow: pollSync,
        applyScoreboardSync: applyScoreboardSync
      };
    })();
  </script>
